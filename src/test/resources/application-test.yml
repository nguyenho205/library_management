spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  liquibase:
    enabled: false   # test dung Hibernate tu tao schema cho nhanh, khong can chay Liquibase

app:
  jwt:
    secret: "TestSecretKeyForJWTSigning_UsedOnlyInUnitTests_1234567890"
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  mail:
    enabled: false
