services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_USER: ${MYSQL_USER:-library}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-library_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/library_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&tinyInt1isBit=false
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-library}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-library_dev_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-replace-with-a-random-secret-of-at-least-64-bytes-before-sharing-this-project-2026}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-${SPRING_MAIL_USERNAME:-}}
      APP_DEFAULT_ADMIN_EMAIL: ${APP_DEFAULT_ADMIN_EMAIL:-admin@library.local}
      APP_DEFAULT_ADMIN_PASSWORD: ${APP_DEFAULT_ADMIN_PASSWORD:-Admin@123}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - book_covers:/app/frontend/public/anhbia
      - book_spines:/app/frontend/public/biasach
      - book_assets:/app/public/anhbia
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  mobile-dev:
    profiles: ["mobile-dev"]
    build:
      context: ./mobile
      dockerfile: Dockerfile
    command: ["npx", "expo", "start", "--lan", "--port", "8081"]
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://host.docker.internal:8080/api}
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  book_covers:
  book_spines:
  book_assets:
